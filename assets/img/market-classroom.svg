<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Market Classroom">
<style>
.bg{fill:#dff3ea}.card{fill:#ffffff;stroke:#d3e2da;stroke-width:2}.sand{fill:#efe5d3}.terra{fill:#ad4521}.mint{fill:#3fb68b}.acc{fill:#0e6b4f}
.line{fill:#d3e2da}.num{font-family:Georgia,'Times New Roman',serif;font-weight:600}.ink{fill:#0e6b4f}.sandink{fill:#6f5122}.terraink{fill:#ad4521}
@media (prefers-color-scheme:dark){.bg{fill:#17322a}.card{fill:#15201c;stroke:#2b3c35}.sand{fill:#2e2820}.terra{fill:#f08a62}.acc{fill:#6fd6ae}
.line{fill:#2b3c35}.ink{fill:#6fd6ae}.sandink{fill:#e2c48f}.terraink{fill:#f08a62}}
</style>
<rect class="bg" width="800" height="450"/>
<g transform="rotate(-6 250 240)"><rect class="card" x="110" y="120" width="220" height="250" rx="22"/><text class="num sandink" x="140" y="205" font-size="64">3</text>
<rect class="line" x="140" y="240" width="150" height="14" rx="7"/><rect class="line" x="140" y="268" width="110" height="14" rx="7"/></g>
<g transform="rotate(4 540 240)"><rect class="card" x="470" y="110" width="220" height="250" rx="22"/><text class="num terraink" x="500" y="195" font-size="64">2</text>
<rect class="line" x="500" y="230" width="150" height="14" rx="7"/><rect class="line" x="500" y="258" width="110" height="14" rx="7"/></g>
<rect class="card" x="280" y="70" width="240" height="290" rx="24"/>
<text class="num ink" x="314" y="168" font-size="84">1</text>
<rect class="mint" x="314" y="200" width="120" height="16" rx="8"/>
<rect class="line" x="314" y="232" width="172" height="14" rx="7"/><rect class="line" x="314" y="258" width="140" height="14" rx="7"/>
<rect class="sand" x="314" y="292" width="172" height="40" rx="12"/><circle class="terra" cx="338" cy="312" r="7"/>
<rect class="line" x="80" y="400" width="640" height="10" rx="5"/><rect class="mint" x="80" y="400" width="22" height="10" rx="5"/>
</svg>
